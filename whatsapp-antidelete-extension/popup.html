<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WA Anti-Delete</title>
    <style>
      :root {
        --wa-green: #25d366;
        --bg: #ffffff;
        --fg: #111b21;
        --muted: #667781;
        --border: #e9edef;
      }
      body {
        width: 340px;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 12px 14px;
        background: var(--wa-green);
        color: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
      }
      header p {
        margin: 4px 0 0;
        font-size: 11px;
        opacity: 0.9;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-size: 12px;
        border: 1px solid var(--border);
        background: #f0f2f5;
        color: var(--fg);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #e4e7ea;
      }
      #list {
        max-height: 360px;
        overflow-y: auto;
      }
      .item {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .item .meta {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .item .text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .empty {
        padding: 24px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WA Anti-Delete</h1>
      <p>Mensajes capturados en esta sesión de WhatsApp Web</p>
    </header>
    <div class="toolbar">
      <span id="count">0 mensajes</span>
      <button id="clear">Borrar registro</button>
    </div>
    <div id="list"></div>
    <script src="popup.js"></script>
  </body>
</html>
